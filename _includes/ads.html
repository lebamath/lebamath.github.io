<!--
  右侧广告栏。

  当前是占位框，等 Google AdSense 账号申请通过、拿到 client id（ca-pub-xxxxxxxxxx）
  和广告单元 slot id 之后，把下面这段替换成 AdSense 给的代码即可，例如：

  <ins class="adsbygoogle"
       style="display:block"
       data-ad-client="ca-pub-XXXXXXXXXX"
       data-ad-slot="XXXXXXXXXX"
       data-ad-format="auto"
       data-full-width-responsive="true"></ins>
  <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>

  同时别忘了在 _layouts/default.html 的 <head> 里加上 AdSense 的加载脚本
  （那边已经留了 TODO 注释）。
-->
<div class="ad-slot">
  {% assign ad_lang = page.ad_lang | default: page.lang | default: "zh" %}
  {% if ad_lang == "en" %}
  <span class="ad-slot__label">Ad space available. Contact: <a href="mailto:wirelessShareNotes@foxmail.com">wirelessShareNotes@foxmail.com</a></span>
  {% else %}
  <span class="ad-slot__label">广告位招租，邮件：<a href="mailto:wirelessShareNotes@foxmail.com">wirelessShareNotes@foxmail.com</a></span>
  {% endif %}
</div>
